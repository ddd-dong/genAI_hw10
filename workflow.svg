<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1130" width="1080" height="1130" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5f6b7d"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#b5462f"/></marker></defs>
<text x="40" y="34" font-size="22" font-weight="700" fill="#1d2330">SAE &amp; Steering LLM Wiki：workflow</text>
<rect x="321" y="118" width="298" height="236" rx="14" fill="none" stroke="#2f6fdb" stroke-dasharray="6 5"/>
<text x="309" y="140" font-size="14" text-anchor="end" fill="#2f6fdb">每篇資料各跑一次，共 8 次</text>
<text x="40" y="130" font-size="15" font-weight="700" fill="#5f6b7d">建 Wiki</text>
<line x1="40" y1="475" x2="1040" y2="475" stroke="#d9dee6"/>
<text x="40" y="500" font-size="15" font-weight="700" fill="#5f6b7d">做簡報</text>
<rect x="345" y="37" width="250" height="46" rx="10" fill="#eceff3" stroke="#6b778a" stroke-width="2"/><text x="470" y="66" font-size="17" text-anchor="middle" fill="#1d2330">A 討論（先討論、後生成）</text>
<text x="309" y="65" font-size="13.5" text-anchor="end" fill="#5f6b7d">主題、對象、8 篇資料、12 個概念頁先定好</text>
<rect x="345" y="152" width="250" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="470" y="181" font-size="17" text-anchor="middle" fill="#1d2330">B 取得資料、寫 raw 筆記</text>
<rect x="345" y="222" width="250" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="470" y="251" font-size="17" text-anchor="middle" fill="#1d2330">C 寫入 wiki</text>
<rect x="345" y="292" width="250" height="46" rx="10" fill="#e3f4ea" stroke="#2f8f5b" stroke-width="2"/><text x="470" y="321" font-size="17" text-anchor="middle" fill="#1d2330">D 格式檢查</text>
<text x="309" y="320" font-size="13.5" text-anchor="end" fill="#5f6b7d">8 次都是 0 錯誤</text>
<rect x="345" y="397" width="250" height="46" rx="10" fill="#fcebe1" stroke="#d9662b" stroke-width="2"/><text x="470" y="426" font-size="17" text-anchor="middle" fill="#1d2330">E 內容核對（對照原文筆記）</text>
<text x="309" y="425" font-size="13.5" text-anchor="end" fill="#5f6b7d">98 條 + 12 句摘要：6 個問題，已修正</text>
<rect x="345" y="487" width="250" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="470" y="516" font-size="17" text-anchor="middle" fill="#1d2330">F 寫大綱</text>
<rect x="345" y="557" width="250" height="46" rx="10" fill="#e3f4ea" stroke="#2f8f5b" stroke-width="2"/><text x="470" y="586" font-size="17" text-anchor="middle" fill="#1d2330">G 大綱檢查</text>
<text x="309" y="585" font-size="13.5" text-anchor="end" fill="#5f6b7d">16 張 0 錯誤</text>
<rect x="345" y="627" width="250" height="46" rx="10" fill="#e3f4ea" stroke="#2f8f5b" stroke-width="2"/><text x="470" y="656" font-size="17" text-anchor="middle" fill="#1d2330">H 取出內容</text>
<text x="309" y="655" font-size="13.5" text-anchor="end" fill="#5f6b7d">只取已核對原文的內容</text>
<rect x="345" y="697" width="250" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="470" y="726" font-size="17" text-anchor="middle" fill="#1d2330">I 生成 HTML 簡報</text>
<rect x="345" y="767" width="250" height="46" rx="10" fill="#e3f4ea" stroke="#2f8f5b" stroke-width="2"/><text x="470" y="796" font-size="17" text-anchor="middle" fill="#1d2330">J 簡報檢查</text>
<text x="309" y="795" font-size="13.5" text-anchor="end" fill="#5f6b7d">第 1 次 2 個錯誤（數字標錯 wiki 頁），修正後 0</text>
<rect x="345" y="837" width="250" height="46" rx="10" fill="#e3f4ea" stroke="#2f8f5b" stroke-width="2"/><text x="470" y="866" font-size="17" text-anchor="middle" fill="#1d2330">L 用字檢查</text>
<text x="309" y="865" font-size="13.5" text-anchor="end" fill="#5f6b7d">3 輪被標出：9、2、0 句</text>
<rect x="345" y="937" width="250" height="46" rx="10" fill="#e3f4ea" stroke="#2f8f5b" stroke-width="2"/><text x="470" y="966" font-size="17" text-anchor="middle" fill="#1d2330">K 版面檢查</text>
<text x="309" y="965" font-size="13.5" text-anchor="end" fill="#5f6b7d">沒有超出版面；3 張留白過多已調整</text>
<rect x="345" y="1027" width="250" height="46" rx="10" fill="#eceff3" stroke="#6b778a" stroke-width="2"/><text x="470" y="1056" font-size="17" text-anchor="middle" fill="#1d2330">輸出：Wiki + 教學簡報</text>
<rect x="695" y="887" width="250" height="46" rx="10" fill="#fcebe1" stroke="#d9662b" stroke-width="2"/><text x="820" y="916" font-size="17" text-anchor="middle" fill="#1d2330">M 用字修改（刪除或改寫）</text>
<text x="820" y="950" font-size="13.5" text-anchor="middle" fill="#5f6b7d">刪除 8 句、改寫 5 句；人工閱讀另找到 4 句</text>
<line x1="470" y1="83" x2="470" y2="150" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="198" x2="470" y2="220" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="268" x2="470" y2="290" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="338" x2="470" y2="395" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="443" x2="470" y2="485" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="533" x2="470" y2="555" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="603" x2="470" y2="625" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="673" x2="470" y2="695" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="743" x2="470" y2="765" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="813" x2="470" y2="835" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="883" x2="470" y2="935" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="983" x2="470" y2="1025" stroke="#5f6b7d" stroke-width="2" marker-end="url(#a)"/>
<path d="M595 315 H640 V237 H599" fill="none" stroke="#b5462f" stroke-width="2" marker-end="url(#r)"/>
<text x="648" y="281" font-size="13.5" fill="#b5462f">有錯誤：修正</text>
<path d="M595 420 H770 V253 H599" fill="none" stroke="#b5462f" stroke-width="2" marker-end="url(#r)"/>
<text x="778" y="341" font-size="13.5" fill="#b5462f">超出來源、標錯：修正</text>
<path d="M595 580 H640 V510 H599" fill="none" stroke="#b5462f" stroke-width="2" marker-end="url(#r)"/>
<text x="648" y="550" font-size="13.5" fill="#b5462f">沒有 wiki 內容：刪掉那張</text>
<path d="M595 588 H1000 V175 H623" fill="none" stroke="#b5462f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
<text x="1006" y="205" font-size="13" fill="#b5462f" transform="rotate(90 1006 205)">或回 B 補資料</text>
<path d="M595 780 H640 V720 H599" fill="none" stroke="#b5462f" stroke-width="2" marker-end="url(#r)"/>
<text x="648" y="755" font-size="13.5" fill="#b5462f">數字不在標明的頁：修正</text>
<path d="M595 860 H820 V885" fill="none" stroke="#b5462f" stroke-width="2" marker-end="url(#r)"/>
<text x="605" y="852" font-size="13.5" fill="#b5462f">有句子被標出</text>
<path d="M945 910 H1000 V800 H599" fill="none" stroke="#d9662b" stroke-width="2" marker-end="url(#r)"/>
<text x="827" y="782" font-size="13.5" fill="#d9662b">改完回 J、L 重新檢查（最多 3 輪）</text>
<path d="M345 960 H333 V720 H341" fill="none" stroke="#b5462f" stroke-width="2" marker-end="url(#r)"/>
<text x="325" y="986" font-size="13.5" text-anchor="end" fill="#b5462f">超出版面：回 I 修正</text>
<rect x="40" y="1086" width="22" height="18" rx="4" fill="#eceff3" stroke="#6b778a" stroke-width="2"/><text x="70" y="1101" font-size="14" fill="#1d2330">人 / 輸出</text>
<rect x="210" y="1086" width="22" height="18" rx="4" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="240" y="1101" font-size="14" fill="#1d2330">LLM 生成</text>
<rect x="380" y="1086" width="22" height="18" rx="4" fill="#e3f4ea" stroke="#2f8f5b" stroke-width="2"/><text x="410" y="1101" font-size="14" fill="#1d2330">程式檢查</text>
<rect x="550" y="1086" width="22" height="18" rx="4" fill="#fcebe1" stroke="#d9662b" stroke-width="2"/><text x="580" y="1101" font-size="14" fill="#1d2330">LLM + 人檢查</text>
<line x1="730" y1="1095" x2="770" y2="1095" stroke="#b5462f" stroke-width="2" marker-end="url(#r)"/><text x="780" y="1101" font-size="14">失敗時回去</text>
</svg>